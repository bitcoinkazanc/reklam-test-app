<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reklam Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

  <!-- AdsGram -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- RichAds -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      margin: 10px auto;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #adsgramBtn {
      background: #0088cc;
      color: white;
    }

    #richadsBtn {
      background: #222;
      color: white;
      display: none;
    }

    #message {
      margin-top: 25px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Reklam Test</h1>

  <button id="adsgramBtn">
    1. Reklamı İzle
  </button>

  <button id="richadsBtn">
    2. Reklamı İzle
  </button>

  <div id="message"></div>

  <script>
    const adsgramBtn = document.getElementById("adsgramBtn");
    const richadsBtn = document.getElementById("richadsBtn");
    const message = document.getElementById("message");

    // =========================
    // ADSGRAM
    // =========================

    const adsgramController = window.Adsgram.init({
      blockId: "43530"
    });

    adsgramBtn.addEventListener("click", async () => {

      message.textContent = "AdsGram reklamı hazırlanıyor...";

      try {

        await adsgramController.show();

        message.textContent = "1. reklam tamamlandı.";

        adsgramBtn.style.display = "none";
        richadsBtn.style.display = "block";

      } catch (error) {

        console.error("AdsGramError:", error);

        message.textContent =
          "AdsGram reklamı gösterilemedi.";
      }
    });


    // =========================
    // RICHADS
    // =========================

    richadsBtn.addEventListener("click", async () => {

      message.textContent = "RichAds reklamı hazırlanıyor...";

      try {

        window.TelegramAdsController =
          new TelegramAdsController();

        window.TelegramAdsController.initialize({
          pubId: "1020586",
          appId: "8593"
        });

        const richadsController =
          window.TelegramAdsController;

        await richadsController.triggerInterstitialVideo();

        message.textContent =
          "Tüm reklamlar tamamlandı. 🎉";

        richadsBtn.style.display = "none";

      } catch (error) {

        console.error("RichAdsError:", error);

        message.textContent =
          "RichAds reklamı gösterilemedi.";
      }
    });

  </script>

</body>
</html>
