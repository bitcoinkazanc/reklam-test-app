<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reklam Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- RichAds SDK -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 Reklam Test</h1>

    <p>AdsGram → RichAds test uygulaması</p>

    <button id="watchAd">
      Reklam İzle
    </button>

    <p id="result"></p>

  </div>

  <script>

    // ==========================================
    // TELEGRAM MINI APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // ADSGRAM
    // ==========================================

    const AdController = window.Adsgram.init({
      blockId: "43478",
      debug: true
    });


    // ==========================================
    // RICHADS
    // ==========================================

    const richadsController =
      new window.TelegramAdsController();

    richadsController.initialize({
      pubId: "1020586",
      appId: "8593",
      debug: true
    });


    // ==========================================
    // BUTON
    // ==========================================

    const button = document.getElementById("watchAd");
    const result = document.getElementById("result");


    button.addEventListener("click", async () => {

      button.disabled = true;

      result.textContent =
        "1/2 AdsGram reklamı yükleniyor...";


      // ==========================================
      // 1. ADSGRAM
      // ==========================================

      try {

        const adResult =
          await AdController.show();

        console.log(
          "AdsGram sonucu:",
          adResult
        );


        if (!adResult.done) {

          result.textContent =
            "⚠️ AdsGram reklamı tamamlanmadı.";

          button.disabled = false;

          return;
        }


        // ==========================================
        // 2. RICHADS
        // ==========================================

        result.textContent =
          "✅ AdsGram tamamlandı. 2/2 RichAds reklamı yükleniyor...";


        try {

          const richAdsResult =
            await richadsController.triggerInterstitialVideo();

          console.log(
            "RichAds sonucu:",
            richAdsResult
          );


          result.textContent =
            "🎉 AdsGram + RichAds tamamlandı!";


        } catch (richAdsError) {

          console.error(
            "RichAds hata:",
            richAdsError
          );

          result.textContent =
            "❌ RichAds reklamı gösterilemedi.";

        }


      } catch (adsGramError) {

        console.error(
          "AdsGram hata:",
          adsGramError
        );

        result.textContent =
          "❌ AdsGram reklamı gösterilemedi.";

      }


      button.disabled = false;

    });

  </script>

</body>
</html>
