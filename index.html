<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RichAds Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- RichAds -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 RichAds Test</h1>

    <p>Telegram Interstitial Video</p>

    <button id="watchAd">
      RichAds Reklamını İzle
    </button>

    <p id="result"></p>

  </div>

  <script>

    // ==========================================
    // TELEGRAM MINI APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // RICHADS
    // ==========================================

    const richadsController =
      new window.TelegramAdsController();


    richadsController.initialize({
      pubId: "1020586",
      appId: "8593"
    });


    // ==========================================
    // BUTON
    // ==========================================

    const button =
      document.getElementById("watchAd");

    const result =
      document.getElementById("result");


    button.addEventListener("click", () => {

      button.disabled = true;

      result.textContent =
        "RichAds reklamı yükleniyor...";


      richadsController
        .triggerInterstitialVideo()

        .then((adResult) => {

          console.log(
            "RichAds sonucu:",
            adResult
          );

          result.textContent =
            "✅ RichAds reklamı tamamlandı!";

        })

        .catch((error) => {

          console.error(
            "RichAds hata:",
            error
          );

          let errorText = "";

          try {

            if (error === null) {

              errorText = "null";

            } else if (error === undefined) {

              errorText = "undefined";

            } else if (typeof error === "string") {

              errorText = error;

            } else if (error.message) {

              errorText = error.message;

            } else {

              errorText =
                Object.getOwnPropertyNames(error)
                  .map(key => key + ": " + error[key])
                  .join("\n");

            }

          } catch (e) {

            errorText =
              "Hata ayrıntısı okunamadı.";

          }


          result.textContent =
            "❌ RichAds hata:\n" +
            errorText;

        })

        .finally(() => {

          button.disabled = false;

        });

    });

  </script>

</body>
</html>
