<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reklam Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- RichAds SDK -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <script>
    window.TelegramAdsController = new TelegramAdsController();

    window.TelegramAdsController.initialize({
      pubId: "1020586",
      appId: "8593",
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 Reklam Test</h1>

    <p>AdsGram ve RichAds reklamlarını test ediyoruz.</p>

    <button id="watchAd">
      Reklam İzle
    </button>

    <p id="result"></p>

  </div>

  <script>
    // ==========================================
    // TELEGRAM MINI APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // ADSGRAM
    // ==========================================

    const AdController = window.Adsgram.init({
      blockId: "43478",
      debug: true
    });


    // ==========================================
    // BUTON
    // ==========================================

    const button = document.getElementById("watchAd");
    const result = document.getElementById("result");


    button.addEventListener("click", async () => {

      button.disabled = true;

      result.textContent = "AdsGram reklamı yükleniyor...";


      try {

        const adResult = await AdController.show();

        console.log("AdsGram sonucu:", adResult);


        if (adResult.done) {

          result.textContent =
            "✅ AdsGram reklamı tamamlandı!";

        } else {

          result.textContent =
            "⚠️ AdsGram reklamı tamamlanmadı.";

        }

      } catch (error) {

        console.error("AdsGram hata:", error);

        result.textContent =
          "❌ AdsGram reklamı gösterilemedi.";

      } finally {

        button.disabled = false;

      }

    });

  </script>

</body>
</html>
