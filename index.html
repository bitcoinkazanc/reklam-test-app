<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reklam Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎬 Reklam Test</h1>

    <p>AdsGram reklam entegrasyonunu test edeceğiz.</p>

    <button id="watchAd">
      Reklam İzle
    </button>

    <p id="result"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    document.getElementById("watchAd").addEventListener("click", function () {
      document.getElementById("result").textContent =
        "Reklam sistemi henüz bağlanmadı.";
    });
  </script>

</body>
  </html>
