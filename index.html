<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reklam Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

  <!-- AdsGram -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- RichAds -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #2481cc;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #secondButton {
      display: none;
    }

    #result {
      margin-top: 20px;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 Reklam Test</h1>

    <p id="description">
      Önce AdsGram reklamını izleyin.
    </p>

    <!-- 1. REKLAM -->
    <button id="firstButton">
      1. Reklamı İzle
    </button>

    <!-- 2. REKLAM -->
    <button id="secondButton">
      2. Reklamı İzle
    </button>

    <p id="result"></p>

  </div>


  <script>

    // ==========================================
    // TELEGRAM MINI APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // ADSGRAM
    // ==========================================

    const adsgramController =
      window.Adsgram.init({
        blockId: "43478"
      });


    // ==========================================
    // RICHADS
    // ==========================================

    const richadsController =
      new window.TelegramAdsController();


    richadsController.initialize({
      pubId: "1020586",
      appId: "8593",
      debug: true
    });


    // ==========================================
    // ELEMENTLER
    // ==========================================

    const firstButton =
      document.getElementById("firstButton");

    const secondButton =
      document.getElementById("secondButton");

    const result =
      document.getElementById("result");

    const description =
      document.getElementById("description");


    // ==========================================
    // 1. ADSGRAM
    // ==========================================

    firstButton.addEventListener("click", async () => {

      firstButton.disabled = true;

      result.textContent =
        "AdsGram reklamı yükleniyor...";


      try {

        const adsgramResult =
          await adsgramController.show();


        console.log(
          "AdsGram sonucu:",
          adsgramResult
        );


        // AdsGram tamamlandı
        result.textContent =
          "✅ 1. reklam tamamlandı.";


        description.textContent =
          "Şimdi ikinci reklamı izleyebilirsiniz.";


        // 1. butonu gizle
        firstButton.style.display =
          "none";


        // 2. butonu göster
        secondButton.style.display =
          "block";


      } catch (error) {

        console.error(
          "AdsGram hata:",
          error
        );


        result.textContent =
          "❌ AdsGram reklamı tamamlanmadı.";


        firstButton.disabled =
          false;
      }

    });


    // ==========================================
    // 2. RICHADS
    // ==========================================

    secondButton.addEventListener("click", async () => {

      secondButton.disabled = true;

      result.textContent =
        "RichAds reklamı yükleniyor...";


      try {

        const richadsResult =
          await richadsController
            .triggerInterstitialVideo();


        console.log(
          "RichAds sonucu:",
          richadsResult
        );


        // RichAds tamamlandı
        result.textContent =
          "✅ 1. reklam tamamlandı.\n" +
          "✅ 2. reklam tamamlandı.\n\n" +
          "🎉 İki reklam da tamamlandı!";


        description.textContent =
          "Reklam görevi tamamlandı.";


        secondButton.style.display =
          "none";


      } catch (error) {

        console.error(
          "RichAds hata:",
          error
        );


        let errorText = "";


        try {

          if (error === null) {

            errorText = "null";

          } else if (error === undefined) {

            errorText = "undefined";

          } else if (typeof error === "string") {

            errorText = error;

          } else if (error.message) {

            errorText = error.message;

          } else {

            errorText =
              Object.getOwnPropertyNames(error)
                .map(
                  key =>
                    key + ": " + error[key]
                )
                .join("\n");
          }

        } catch (e) {

          errorText =
            "Hata ayrıntısı okunamadı.";
        }


        result.textContent =
          "❌ RichAds reklamı tamamlanmadı.\n\n" +
          errorText;


        secondButton.disabled =
          false;
      }

    });

  </script>

</body>
</html>
